<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital NM Antibiogram</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap');

:root {
  --green: #0fbe7b;
  --yellow: #f3aa1f;
  --red: #f05252;
  --ink: #112034;
  --muted: #536176;
  --accent: #0f9d8a;
  --accent-strong: #0b6b5f;
  --accent-soft: rgba(15, 157, 138, 0.12);
  --sunset: #f97316;
  --card-bg: rgba(255, 255, 255, 0.85);
  --card-border: rgba(15, 109, 120, 0.18);
  --card-shadow: 0 28px 60px -35px rgba(17, 32, 52, 0.55);
  --chip-shadow: 0 10px 30px rgba(17, 32, 52, 0.16);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  margin: 0;
  font-size: 17px;
  background: radial-gradient(circle at 10% 10%, rgba(255, 241, 223, 0.75), transparent 55%),
    radial-gradient(circle at 80% 0%, rgba(233, 213, 255, 0.9), transparent 50%),
    linear-gradient(to right, #f6f7fb 0%, #fdf6ef 100%);
  color: var(--ink);
  min-height: 100vh;
}

body::before,
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  mix-blend-mode: multiply;
  opacity: 0.4;
}

body::before {
  background: radial-gradient(circle at 0% 100%, rgba(249, 196, 126, 0.55), transparent 45%);
}

body::after {
  background: radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.28), transparent 40%);
}

a {
  color: inherit;
}

#homeLink {
  text-decoration: none;
}

#homeLink:focus {
  outline: 3px solid rgba(255, 255, 255, 0.75);
  outline-offset: 4px;
  border-radius: 12px;
}

::selection {
  background: rgba(15, 157, 138, 0.2);
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  padding: 1.15rem 1.75rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  background: linear-gradient(135deg, rgba(91, 33, 182, 0.85), rgba(168, 85, 247, 0.92));
  color: #fff;
  box-shadow: 0 12px 24px rgba(15, 49, 69, 0.28);
}

header .title {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

h1 {
  font-size: 1.55rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
}

main {
  max-width: 960px;
  margin: 4rem auto 3.5rem;
  padding: 0 1.5rem 4rem;
  display: grid;
  gap: 1.75rem;
}

.view {
  padding: 1.75rem;
  background: var(--card-bg);
  border-radius: 28px;
  border: 1px solid var(--card-border);
  box-shadow: var(--card-shadow);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.view:not([hidden]):hover {
  transform: translateY(-4px);
  box-shadow: 0 26px 50px rgba(17, 32, 52, 0.26);
}

label {
  font-weight: 600;
  color: var(--muted);
  display: block;
  margin-bottom: 0.65rem;
}

select,
input[type="search"] {
  width: 100%;
  padding: 0.85rem 1rem;
  border-radius: 16px;
  border: 1px solid rgba(15, 157, 138, 0.25);
  background: rgba(255, 255, 255, 0.95);
  font: inherit;
  color: var(--ink);
  box-shadow: inset 0 1px 1px rgba(15, 34, 52, 0.05);
  transition: border 0.2s ease, box-shadow 0.2s ease;
}

select:focus,
input[type="search"]:focus {
  outline: none;
  border-color: rgba(15, 157, 138, 0.6);
  box-shadow: 0 0 0 3px rgba(15, 157, 138, 0.15);
}

#context {
  display: grid;
  gap: 0.75rem;
  margin-top: 0.75rem;
}

#context button {
  padding: 0.95rem 1.2rem;
  border: 1px solid transparent;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.65);
  font: inherit;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

#context button::after {
  content: '\2192';
  font-size: 1rem;
  color: var(--muted);
  transition: transform 0.2s ease, color 0.2s ease;
}

#context button:hover,
#context button:focus {
  background: rgba(255, 255, 255, 0.9);
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(17, 32, 52, 0.18);
}

#context button:hover::after,
#context button:focus::after {
  color: var(--accent);
  transform: translateX(3px);
}

#context button.active {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.22), rgba(192, 132, 252, 0.2));
  border-color: rgba(168, 85, 247, 0.3);
  box-shadow: 0 14px 35px rgba(91, 33, 182, 0.25);
}

#organismSearch {
  margin: 1.3rem 0 1rem;
}

#organisms {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 60vh;
  overflow: auto;
  display: grid;
  gap: 0.6rem;
}

#organisms::-webkit-scrollbar {
  width: 0.55rem;
}

#organisms::-webkit-scrollbar-thumb {
  background: rgba(15, 157, 138, 0.35);
  border-radius: 999px;
}

#organisms button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 0.9rem 1.1rem;
  text-align: left;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(15, 157, 138, 0.12);
  border-radius: 16px;
  font: inherit;
  color: var(--ink);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

#organisms button::after {
  content: '\203A';
  font-size: 1.25rem;
  color: var(--muted);
  transition: transform 0.2s ease, color 0.2s ease;
}

#organisms button:hover,
#organisms button:focus {
  transform: translateY(-2px);
  box-shadow: 0 16px 34px rgba(17, 32, 52, 0.18);
  border-color: rgba(15, 157, 138, 0.35);
}

#organisms button:hover::after,
#organisms button:focus::after {
  transform: translateX(4px);
  color: var(--accent-strong);
}

#results[hidden] {
  display: none;
}

#organismTitle {
  font-size: 1.7rem;
  margin: 0 0 0.45rem;
  letter-spacing: -0.01em;
}

#contextFlag {
  margin: 0 0 1.1rem;
  padding: 0.75rem 1rem;
  border-radius: 14px;
  background: rgba(239, 68, 68, 0.12);
  color: #b91c1c;
  border: 1px solid rgba(239, 68, 68, 0.25);
  font-weight: 600;
}

#contextFlag:empty {
  display: none;
}

#antibiotics {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0.75rem;
}

#antibiotics details {
  display: block;
  background: rgba(255, 255, 255, 0.98);
  border-radius: 20px;
  border: 1px solid rgba(17, 84, 101, 0.14);
  box-shadow: 0 18px 35px rgba(17, 32, 52, 0.16);
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border 0.2s ease;
}

#antibiotics details:hover,
#antibiotics details:focus-within {
  transform: translateY(-2px);
  box-shadow: 0 24px 45px rgba(17, 32, 52, 0.22);
  border-color: rgba(15, 157, 138, 0.25);
}

#antibiotics summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.05rem 1.3rem;
  cursor: pointer;
  gap: 1rem;
}

#antibiotics summary::-webkit-details-marker {
  display: none;
}

#antibiotics .summary-right {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
}

#antibiotics .meta {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}

#antibiotics .badge-group {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
}

#antibiotics .info-tag {
  background: rgba(240, 82, 82, 0.18);
  color: #b91c1c;
  border-radius: 999px;
  padding: 0.2rem 0.65rem;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

#antibiotics details.has-info .drug {
  display: flex;
  align-items: center;
  font-weight: 600;
  gap: 0.45rem;
}

#antibiotics details.has-info .drug::after {
  content: '\25B8';
  font-size: 1rem;
  color: var(--muted);
  transition: transform 0.2s ease, color 0.2s ease;
}

#antibiotics details.has-info[open] .drug::after {
  transform: rotate(90deg);
  color: var(--accent-strong);
}

#antibiotics .pct {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 700;
  color: var(--ink);
}

#antibiotics .chip {
  width: 1.1rem;
  height: 1.1rem;
  border-radius: 999px;
  display: inline-block;
  box-shadow: var(--chip-shadow);
}

.band-green {
  background: var(--green);
}

.band-yellow {
  background: var(--yellow);
}

.band-red {
  background: var(--red);
}

.badge {
  background: rgba(15, 157, 138, 0.12);
  color: var(--accent-strong);
  border-radius: 999px;
  padding: 0.2rem 0.6rem;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.01em;
}

#antibiotics .drawer {
  padding: 0.85rem 1.3rem 1.1rem;
  border-top: 1px solid rgba(15, 34, 52, 0.08);
  background: rgba(247, 250, 252, 0.8);
}

#antibiotics .drawer .info-section + .info-section {
  margin-top: 0.95rem;
}

#antibiotics .drawer-heading {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--accent-strong);
}

#antibiotics .drawer ul {
  margin: 0.45rem 0 0;
  padding-left: 1.2rem;
}

#antibiotics .drawer ul + ul {
  margin-top: 0.6rem;
}

#antibiotics .drawer li {
  margin: 0.25rem 0;
}

#filter80 {
  margin: 1.25rem 0 1.1rem;
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  background: rgba(15, 157, 138, 0.12);
  color: var(--accent-strong);
  font-weight: 600;
  padding: 0.5rem 0.9rem;
  border-radius: 999px;
  border: 1px solid rgba(15, 157, 138, 0.28);
}

#filter80 input {
  width: 1rem;
  height: 1rem;
  accent-color: var(--accent);
}

#noData {
  margin-top: 1.5rem;
  font-weight: 600;
  color: var(--muted);
}

footer {
  margin-top: 2rem;
  padding: 2.25rem 1.5rem 3rem;
  text-align: center;
  color: var(--ink);
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 243, 233, 0.95));
  border-top: 1px solid rgba(15, 157, 138, 0.18);
  box-shadow: 0 -12px 30px rgba(17, 32, 52, 0.08);
  display: grid;
  gap: 1.1rem;
  justify-items: center;
}

footer .bands {
  display: flex;
  gap: 1.2rem;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  font-weight: 600;
}

footer .bands span {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 0.85rem;
  border-radius: 999px;
  background: rgba(15, 157, 138, 0.08);
}

footer .bands .chip {
  width: 1.2rem;
  height: 1.2rem;
  border-radius: 50%;
  box-shadow: var(--chip-shadow);
}

footer .hint {
  margin: 0;
  font-size: 1.05rem;
  color: var(--muted);
}

footer .credit {
  font-size: 0.9rem;
  color: rgba(17, 32, 52, 0.6);
  margin: 0;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 820px) {
  header {
    flex-direction: column;
    align-items: flex-start;
    padding: 1.2rem 1.4rem 1.5rem;
    gap: 0.75rem;
  }

  main {
    margin: 2.5rem auto 3rem;
    padding-bottom: 3rem;
  }

  .view {
    padding: 1.45rem;
  }
}

@media (max-width: 580px) {
  header {
    border-bottom-left-radius: 24px;
    border-bottom-right-radius: 24px;
  }

  main {
    padding: 0 1rem 2.5rem;
    gap: 1.25rem;
  }

  #context button,
  #organisms button {
    padding: 0.85rem 1rem;
  }

  #antibiotics summary {
    padding: 0.9rem 1rem;
    flex-wrap: wrap;
  }

  #antibiotics .pct {
    margin-left: auto;
  }

  footer {
    padding: 2rem 1.1rem 2.6rem;
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<header>
<div class="title">
<h1><a href="/" id="homeLink">Digital NM Antibiogram</a></h1>
</div>
</header>
<main>
<section id="siteView" class="view">
<label for="site">Select site:</label>
<select id="site"></select>
</section>
<section id="contextView" class="view" hidden>
<h2>Choose context</h2>
<div id="context" role="tablist"></div>
</section>
<section id="organismView" class="view" hidden>
<label for="organismSearch" class="visually-hidden">Search organism</label>
<input id="organismSearch" type="search" placeholder="Search organism" aria-label="Search organism">
<ul id="organisms"></ul>
</section>
<section id="results" class="view" hidden>
<h2 id="organismTitle"></h2>
<p id="contextFlag"></p>
<label id="filter80"><input type="checkbox"> Show only ≥80% susceptible</label>
<ul id="antibiotics"></ul>
<p id="noData" hidden>No antibiotics match the current filters for this organism/context at this site.</p>
</section>
</main>
<footer>
<div class="bands"><strong>Color key:</strong>
<span><span class="chip band-red"></span>≤69%</span>
<span><span class="chip band-yellow"></span>70–79%</span>
<span><span class="chip band-green"></span>≥80%</span>
</div>
<p class="hint"></p>
<p class="credit">Made with ❤️ for the Northwestern Medicine community.</p>
</footer>
<script>
const DATA_INDEX='data/index.json';

const SPECIMEN_LABELS={
  'Blood':'Blood',
  'ED':'Emergency Department',
  'Facility-Wide':'Facility-Wide',
  'Immunocompromised Host':'Immunocompromised Host',
  'MICU':'MICU',
  'Other ICU':'Other ICU',
  'Respiratory':'Respiratory',
  'Urine':'Urine'
};

const CONTEXT_PRIORITY=[
  'Facility-Wide',
  'Urine',
  'Blood',
  'Emergency Department',
  'Respiratory',
  'MICU',
  'Other ICU',
  'Immunocompromised Host'
];

const CONTRA_FILE='contraindications.md';

const LEGEND={
  hint:'<strong>For severe syndromes aim for ≥90% when feasible; ≥80% may be acceptable for lower-risk infections.</strong> Use patient-level cultures and ID consult for definitive therapy. Data adapted from NM Antimicrobial and Diagnostic Stewardship Program based on <a href="https://adsp.nm.org/antibiogram-resources.html" target="_blank" rel="noopener noreferrer">2024 antibiograms</a>.',
  badges:{}
};

let DATA=null;
let CONTRAINDICATIONS=new Map();
let current={site:null,ctx:null,org:null};
const qs=s=>document.querySelector(s);
const siteSel=qs('#site'),ctxDiv=qs('#context'),orgSearch=qs('#organismSearch'),orgList=qs('#organisms');
const results=qs('#results'),title=qs('#organismTitle'),antList=qs('#antibiotics'),filter80=qs('#filter80 input'),flag=qs('#contextFlag'),noData=qs('#noData'),hint=qs('.hint'),homeLink=qs('#homeLink');
const views=['siteView','contextView','organismView','results'];
let step=0;

loadData();

function loadData(){
  Promise.all([
    loadMarkdownData(),
    loadContraindications()
  ]).then(([entries,contra])=>{
    CONTRAINDICATIONS=contra;
    DATA={legend:LEGEND,sites:buildSites(entries)};
    init();
  }).catch(err=>{
    console.error('Failed to load data',err);
    hint.textContent='Unable to load data. Please refresh.';
    siteSel.innerHTML='<option value="">Data unavailable</option>';
  });
}

function loadMarkdownData(){
  return fetch(DATA_INDEX).then(resp=>{
    if(!resp.ok) throw new Error(`Failed to load ${DATA_INDEX}`);
    return resp.json();
  }).then(list=>{
    if(!Array.isArray(list)) throw new Error('Invalid data index');
    return Promise.all(list.map(entry=>{
      const path=typeof entry==='string'?entry:entry.path;
      if(!path) throw new Error('Invalid data entry');
      return fetch(path).then(resp=>{
        if(!resp.ok) throw new Error(`Failed to load ${path}`);
        return resp.text();
      }).then(text=>parseMarkdown(text,path));
    }));
  });
}

function loadContraindications(){
  return fetch(CONTRA_FILE).then(resp=>{
    if(!resp.ok) throw new Error(`Failed to load ${CONTRA_FILE}`);
    return resp.text();
  }).then(parseContraindications).catch(err=>{
    console.warn('Contraindications unavailable',err);
    return new Map();
  });
}

function parseContraindications(text){
  const map=new Map();
  text.split('\n').forEach(line=>{
    const trimmed=line.trim();
    if(!trimmed.startsWith('|'))return;
    if(/^\|\s*-{3,}/.test(trimmed))return;
    const cells=trimmed.split('|').slice(1,-1).map(cell=>cell.trim());
    if(cells.length<3)return;
    const [drugCell,contraCell,interactionCell]=cells;
    const cleanDrug=drugCell.replace(/\*/g,'').trim();
    if(!cleanDrug||cleanDrug.toLowerCase()==='antibiotic')return;
    const key=canonicalDrugName(cleanDrug);
    if(!key)return;
    map.set(key,{
      contraindications:parseMarkdownList(contraCell),
      interactions:parseMarkdownList(interactionCell)
    });
  });
  return map;
}

function parseMarkdownList(cell){
  if(!cell)return [];
  return cell.split(/-\s+/).map(item=>item.trim()).filter(Boolean);
}

function canonicalDrugName(name){
  return (name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
}

function buildSiteDisplay(meta){
  const region=(meta.region||'').trim();
  const site=(meta.site||'').trim();
  if(region&&site&&region!==site)return `${region} (${site})`;
  return region||site||meta.site_id||'Site';
}

function parseMarkdown(text,path){
  const {meta,body}=extractFrontMatter(text,path);
  const table=parseMarkdownTable(body,path);
  return {meta,table};
}

function extractFrontMatter(text,path){
  const lines=text.split(/\r?\n/);
  if(lines[0]?.trim()!=='---')return{meta:{},body:text};
  let end=1;
  while(end<lines.length&&lines[end].trim()!=='---'){end++;}
  if(end>=lines.length){
    console.warn('Front matter not closed in',path);
    return{meta:{},body:text};
  }
  const metaText=lines.slice(1,end).join('\n').trim();
  let meta={};
  if(metaText){
    try{meta=JSON.parse(metaText);}catch(err){console.warn('Invalid front matter for',path,err);}
  }
  const body=lines.slice(end+1).join('\n');
  return {meta,body};
}

function parseMarkdownTable(body,path){
  const rows=body.split(/\r?\n/).map(line=>line.trim()).filter(Boolean);
  const tableLines=rows.filter(line=>line.startsWith('|'));
  if(!tableLines.length){
    console.warn('No table content found in',path);
    return{headers:[],rows:[]};
  }
  const headers=splitMarkdownRow(tableLines[0]);
  let dataStart=1;
  for(let i=1;i<tableLines.length;i++){
    if(/^\|\s*:?[-]{2,}/.test(tableLines[i])){dataStart=i+1;break;}
  }
  const dataRows=tableLines.slice(dataStart).map(line=>{
    const cells=splitMarkdownRow(line);
    const record={};
    headers.forEach((header,idx)=>{record[header]=cells[idx]??'';});
    return record;
  }).filter(record=>Object.values(record).some(value=>String(value).trim()!==''));
  return{headers,rows:dataRows};
}

function splitMarkdownRow(line){
  const trimmed=line.trim();
  const inner=trimmed.replace(/^\|/,'').replace(/\|$/,'');
  return inner.split('|').map(cell=>cell.trim());
}

function buildSites(entries){
  const siteMap=new Map();
  entries.forEach(entry=>{
    const meta=entry.meta||{};
    const table=entry.table||{};
    const headers=Array.isArray(table.headers)?table.headers:[];
    if(!headers.length)return;
    const siteId=(meta.site_id||slugify(meta.display||meta.site||meta.region||'site')).trim();
    const siteName=(meta.display||buildSiteDisplay(meta)).trim();
    if(!siteMap.has(siteId)){
      siteMap.set(siteId,{id:slugify(siteId),name:siteName,contexts:[]});
    }
    const siteEntry=siteMap.get(siteId);
    const contextLabel=meta.context_label||meta.context||'Context';
    const contextId=slugify(meta.context||contextLabel);
    const notes=Array.isArray(meta.notes)?meta.notes.filter(Boolean):[];
    const flags=Array.isArray(meta.flags)?meta.flags.filter(Boolean):[];
    const isolatesHeader=headers.find(h=>h.toLowerCase()==='isolates')||headers[1];
    const antibioticHeaders=headers.filter(h=>h!==isolatesHeader&&h!==headers[0]);
    const organisms=[];
    (table.rows||[]).forEach(row=>{
      const organismName=row[headers[0]]||row.Organism||'';
      if(!organismName) return;
      const isolates=parseInteger(row[isolatesHeader]);
      const antibiotics=[];
      antibioticHeaders.forEach(header=>{
        const pct=parseNumber(row[header]);
        if(Number.isFinite(pct)){
          const contraEntry=CONTRAINDICATIONS.get(canonicalDrugName(header));
          antibiotics.push({
            drug:header,
            pctS:pct,
            notes:[],
            cautions:[],
            flags:[],
            contraindications:contraEntry?[...contraEntry.contraindications]:[],
            interactions:contraEntry?[...contraEntry.interactions]:[]
          });
        }
      });
      if(!antibiotics.length)return;
      antibiotics.sort((a,b)=>b.pctS-a.pctS||a.drug.localeCompare(b.drug));
      organisms.push({
        id:slugify(organismName),
        display:organismName,
        isolates:Number.isFinite(isolates)?isolates:null,
        antibiotics
      });
    });
    if(!organisms.length)return;
    organisms.sort((a,b)=>a.display.localeCompare(b.display));
    siteEntry.contexts.push({
      id:contextId,
      name:contextLabel,
      flags,
      notes,
      organisms
    });
  });

  return Array.from(siteMap.values()).map(site=>{
    const contexts=site.contexts.filter(ctx=>ctx.organisms.length).sort((a,b)=>contextRank(a.name)-contextRank(b.name)||a.name.localeCompare(b.name));
    return{...site,contexts};
  }).filter(site=>site.contexts.length).sort((a,b)=>a.name.localeCompare(b.name));
}

function parseInteger(value){
  if(value===null||value===undefined)return NaN;
  const str=String(value).trim();
  if(!str)return NaN;
  const num=Number(str.replace(/,/g,''));
  return Number.isFinite(num)?Math.round(num):NaN;
}

function parseNumber(value){
  if(value===null||value===undefined)return NaN;
  const str=String(value).trim();
  if(!str)return NaN;
  const cleaned=str.replace('%','');
  const num=Number(cleaned);
  return Number.isFinite(num)?Math.round(num):NaN;
}

function contextRank(name){
  const idx=CONTEXT_PRIORITY.indexOf(name);
  return idx===-1?CONTEXT_PRIORITY.length:idx;
}

function slugify(str){
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function init(){
  hint.innerHTML=DATA.legend.hint;
  populateSites();
  siteSel.addEventListener('change',()=>{renderContexts(siteSel.value);showStep(1);});
  orgSearch.addEventListener('input',filterOrganisms);
  filter80.addEventListener('change',renderAntibiotics);
  homeLink.addEventListener('click',e=>{e.preventDefault();showStep(0);});
  showStep(0);
}

function populateSites(){
  siteSel.innerHTML='<option value="" selected disabled>Select site</option>'+'\n'+
    DATA.sites.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
}

function renderContexts(siteId){
  current.site=DATA.sites.find(s=>s.id===siteId);
  ctxDiv.innerHTML=current.site.contexts.map(c=>`<button data-id="${c.id}">${c.name}</button>`).join('');
  ctxDiv.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>activateContext(b.dataset.id)));
}

function activateContext(ctxId){
  current.ctx=current.site.contexts.find(c=>c.id===ctxId);
  ctxDiv.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===ctxId));
  flag.textContent='';
  flag.hidden=true;
  renderOrganisms();
  showStep(2);
}

function renderOrganisms(){
  const orgs=current.ctx.organisms.slice().sort((a,b)=>a.display.localeCompare(b.display));
  orgList.innerHTML=orgs.map(o=>`<li><button data-id="${o.id}">${o.display}</button></li>`).join('');
  orgList.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>selectOrganism(b.dataset.id)));
  orgSearch.value='';
  filterOrganisms();
}

function filterOrganisms(){
  const q=orgSearch.value.toLowerCase();
  orgList.querySelectorAll('li').forEach(li=>{
    li.style.display=li.textContent.toLowerCase().includes(q)?'':'none';
  });
}

function selectOrganism(id){
  const org=current.ctx.organisms.find(o=>o.id===id);
  if(!org){
    noData.hidden=false;
    return;
  }
  current.org=org;
  title.textContent=org.display;
  const notice=getContextNotice(current.ctx);
  if(notice){
    flag.textContent=notice;
    flag.hidden=false;
  }else{
    flag.textContent='';
    flag.hidden=true;
  }
  noData.hidden=true;
  renderAntibiotics();
  showStep(3);
}

function renderInfoSection(title,items){
  const list=Array.isArray(items)?items.map(item=>typeof item==='string'?item.trim():item).filter(Boolean):[];
  if(!list.length)return '';
  const entries=list.map(item=>`<li>${formatListItem(item)}</li>`).join('');
  return `<div class="info-section"><h3 class="drawer-heading">${title}</h3><ul>${entries}</ul></div>`;
}

function escapeHtml(str){
  const map={
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  };
  return String(str??'').replace(/[&<>"']/g,ch=>map[ch]);
}

function formatListItem(content){
  const normalized=typeof content==='string'?content.trim():String(content??'');
  if(!normalized)return '';
  const escaped=escapeHtml(normalized);
  return escaped.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

function getContextNotice(ctx){
  if(!ctx)return '';
  const notices=[];
  if(Array.isArray(ctx.flags)){
    ctx.flags.forEach(flagKey=>{
      const text=DATA.legend.badges?DATA.legend.badges[flagKey]:null;
      if(text)notices.push(text);
      else if(typeof flagKey==='string'&&flagKey.trim())notices.push(flagKey.trim());
    });
  }
  if(Array.isArray(ctx.notes)){
    ctx.notes.forEach(note=>{
      if(typeof note==='string'&&note.trim())notices.push(note.trim());
    });
  }
  return notices.join(' • ');
}

function renderAntibiotics(){
  antList.innerHTML='';
  let count=0;
  const abs=current.org.antibiotics.slice().sort((a,b)=>b.pctS-a.pctS||a.drug.localeCompare(b.drug));
  abs.forEach(ab=>{
    if(filter80.checked&&ab.pctS<80)return;
    const band=ab.pctS>=80?'green':ab.pctS>=70?'yellow':'red';
    const badges=(ab.flags||[]).map(f=>`<span class="badge">${DATA.legend.badges[f]||f}</span>`).join('');
    const sections=[];
    const contraindicationsSection=renderInfoSection('Contraindications',ab.contraindications);
    if(contraindicationsSection)sections.push(contraindicationsSection);
    const interactionsSection=renderInfoSection('Major interactions',ab.interactions);
    if(interactionsSection)sections.push(interactionsSection);
    const notesSection=renderInfoSection('Notes',ab.notes);
    if(notesSection)sections.push(notesSection);
    const cautionsSection=renderInfoSection('Cautions',ab.cautions);
    if(cautionsSection)sections.push(cautionsSection);
    const hasInfo=sections.length>0;
    const infoLabel=ab.contraindications&&ab.contraindications.length?'Contraindications':hasInfo?'Details':'';
    const infoTag=infoLabel?`<span class="info-tag">${infoLabel}</span>`:'';
    const badgeGroup=badges?`<span class="badge-group">${badges}</span>`:'';
    const metaParts=[infoTag,badgeGroup].filter(Boolean);
    const metaHtml=metaParts.length?`<span class="meta">${metaParts.join('')}</span>`:'';
    const pctHtml=`<span class="pct"><span class="chip band-${band}" aria-hidden="true"></span>${ab.pctS}%</span>`;
    const summaryRight=`<span class="summary-right">${metaHtml}${pctHtml}</span>`;
    const drawer=hasInfo?`<div class="drawer">${sections.join('')}</div>`:'';
    const cls=hasInfo?' class="has-info"':'';
    antList.insertAdjacentHTML('beforeend',`<li><details${cls}><summary><span class="drug">${escapeHtml(ab.drug)}</span>${summaryRight}</summary>${drawer}</details></li>`);
    count++;
  });
  noData.hidden=count>0;
}

function showStep(n){
  step=Math.max(0,Math.min(views.length-1,n));
  views.forEach((v,i)=>{qs('#'+v).hidden=i!==step;});
}
</script>
