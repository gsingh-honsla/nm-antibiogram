<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital NM Antibiogram</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20120%20120%27%3E%3Ctext%20y%3D%270.9em%27%20font-size%3D%2796%27%3E%F0%9F%A6%A0%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap');

:root {
  --green: #0fbe7b;
  --yellow: #f3aa1f;
  --red: #f05252;
  --ink: #112034;
  --muted: #536176;
  --accent: #0f9d8a;
  --accent-strong: #0b6b5f;
  --accent-soft: rgba(15, 157, 138, 0.12);
  --sunset: #f97316;
  --card-bg: rgba(255, 255, 255, 0.85);
  --card-border: rgba(15, 109, 120, 0.18);
  --card-shadow: 0 28px 60px -35px rgba(17, 32, 52, 0.55);
  --chip-shadow: 0 10px 30px rgba(17, 32, 52, 0.16);
  --violet: #5b21b6;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  margin: 0;
  font-size: 17px;
  background: radial-gradient(circle at 10% 10%, rgba(255, 241, 223, 0.75), transparent 55%),
    radial-gradient(circle at 80% 0%, rgba(233, 213, 255, 0.9), transparent 50%),
    linear-gradient(to right, #f6f7fb 0%, #fdf6ef 100%);
  color: var(--ink);
  min-height: 100vh;
}

body::before,
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  mix-blend-mode: multiply;
  opacity: 0.4;
}

body::before {
  background: radial-gradient(circle at 0% 100%, rgba(249, 196, 126, 0.55), transparent 45%);
}

body::after {
  background: radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.28), transparent 40%);
}

a {
  color: inherit;
}

#homeLink {
  text-decoration: none;
}

#homeLink:focus {
  outline: 3px solid rgba(255, 255, 255, 0.75);
  outline-offset: 4px;
  border-radius: 12px;
}

::selection {
  background: rgba(15, 157, 138, 0.2);
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  padding: 1.15rem 1.75rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  background: linear-gradient(135deg, rgba(91, 33, 182, 0.85), rgba(168, 85, 247, 0.92));
  color: #fff;
  box-shadow: 0 12px 24px rgba(15, 49, 69, 0.28);
}

header .title {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

h1 {
  font-size: 1.55rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
}

main {
  max-width: 960px;
  margin: 4rem auto 0;
  padding: 0 1.5rem 4rem;
  display: grid;
  gap: 1.75rem;
}

.view {
  padding: 1.75rem;
  background: var(--card-bg);
  border-radius: 28px;
  border: 1px solid var(--card-border);
  box-shadow: var(--card-shadow);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.view[hidden] {
  display: none !important;
}

.view:not([hidden]):hover {
  transform: translateY(-4px);
  box-shadow: 0 26px 50px rgba(17, 32, 52, 0.26);
}

label {
  font-weight: 600;
  color: var(--muted);
  display: block;
  margin-bottom: 0.65rem;
}

.back-button {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  margin-bottom: 1rem;
  padding: 0.55rem 1.1rem;
  border-radius: 999px;
  border: 1px solid rgba(15, 157, 138, 0.28);
  background: rgba(15, 157, 138, 0.12);
  font: inherit;
  font-weight: 600;
  color: var(--accent-strong);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}

.back-button .icon {
  font-size: 1.05rem;
  line-height: 1;
}

.back-button:hover,
.back-button:focus {
  background: rgba(15, 157, 138, 0.18);
  border-color: rgba(15, 157, 138, 0.4);
  transform: translateY(-1px);
  box-shadow: 0 18px 35px rgba(17, 32, 52, 0.16);
}

.back-button:focus-visible {
  outline: 3px solid rgba(15, 157, 138, 0.35);
  outline-offset: 2px;
}

select,
input[type="search"] {
  width: 100%;
  padding: 0.85rem 1rem;
  border-radius: 16px;
  border: 1px solid rgba(15, 157, 138, 0.25);
  background: rgba(255, 255, 255, 0.95);
  font: inherit;
  color: var(--ink);
  box-shadow: inset 0 1px 1px rgba(15, 34, 52, 0.05);
  transition: border 0.2s ease, box-shadow 0.2s ease;
}

select:focus,
input[type="search"]:focus {
  outline: none;
  border-color: rgba(15, 157, 138, 0.6);
  box-shadow: 0 0 0 3px rgba(15, 157, 138, 0.15);
}

#siteView {
  display: grid;
  gap: 1.1rem;
  align-content: start;
}

.continue-button {
  display: inline-flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.85rem 1.4rem;
  border-radius: 18px;
  border: none;
  font: inherit;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: #fff;
  background: linear-gradient(135deg, var(--violet), rgba(14, 165, 233, 0.85));
  box-shadow: 0 20px 45px rgba(17, 32, 52, 0.22);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
}

.continue-button .icon {
  font-size: 1.15rem;
  line-height: 1;
}

.continue-button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
  box-shadow: none;
  background: linear-gradient(135deg, rgba(91, 33, 182, 0.45), rgba(14, 165, 233, 0.38));
}

.continue-button:not(:disabled):hover,
.continue-button:not(:disabled):focus {
  transform: translateY(-1px);
  box-shadow: 0 28px 55px rgba(17, 32, 52, 0.26);
}

.continue-button:focus-visible {
  outline: 3px solid rgba(14, 165, 233, 0.4);
  outline-offset: 3px;
}

#context {
  display: grid;
  gap: 0.75rem;
  margin-top: 0.75rem;
}

#context button {
  padding: 0.95rem 1.2rem;
  border: 1px solid transparent;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.65);
  font: inherit;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

#context button::after {
  content: '\2192';
  font-size: 1rem;
  color: var(--muted);
  transition: transform 0.2s ease, color 0.2s ease;
}

#context button:hover,
#context button:focus {
  background: rgba(255, 255, 255, 0.9);
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(17, 32, 52, 0.18);
}

#context button:hover::after,
#context button:focus::after {
  color: var(--accent);
  transform: translateX(3px);
}

#context button.active {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.22), rgba(192, 132, 252, 0.2));
  border-color: rgba(168, 85, 247, 0.3);
  box-shadow: 0 14px 35px rgba(91, 33, 182, 0.25);
}

#organismSearch {
  margin: 1.3rem 0 1rem;
}

#organisms {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 60vh;
  overflow: auto;
  display: grid;
  gap: 0.6rem;
}

#organisms::-webkit-scrollbar {
  width: 0.55rem;
}

#organisms::-webkit-scrollbar-thumb {
  background: rgba(15, 157, 138, 0.35);
  border-radius: 999px;
}

#organisms button {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 0.9rem 1.1rem;
  text-align: left;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(15, 157, 138, 0.12);
  border-radius: 16px;
  font: inherit;
  color: var(--ink);
  cursor: pointer;
  box-shadow: none;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

#organisms button::after {
  content: '\203A';
  font-size: 1.25rem;
  color: var(--muted);
  transition: transform 0.2s ease, color 0.2s ease;
}

#organisms button:hover,
#organisms button:focus {
  transform: translateY(-2px);
  box-shadow: 0 18px 38px rgba(17, 32, 52, 0.2);
  border-color: rgba(15, 157, 138, 0.35);
}

#organisms button:hover::after,
#organisms button:focus::after {
  transform: translateX(4px);
  color: var(--accent-strong);
}

#organisms button.active {
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.22), rgba(192, 132, 252, 0.2));
  border-color: rgba(168, 85, 247, 0.3);
  box-shadow: 0 14px 35px rgba(91, 33, 182, 0.25);
}

#organisms button.active::after {
  color: var(--accent-strong);
}

#results[hidden] {
  display: none;
}

#organismTitle {
  font-size: 1.7rem;
  margin: 0 0 0.45rem;
  letter-spacing: -0.01em;
}

.view-hint {
  margin: 0 0 0.75rem;
  color: var(--muted);
  font-weight: 500;
}

#contextFlag {
  margin: 0 0 1.1rem;
  padding: 0.75rem 1rem;
  border-radius: 14px;
  background: rgba(239, 68, 68, 0.12);
  color: #b91c1c;
  border: 1px solid rgba(239, 68, 68, 0.25);
  font-weight: 600;
}

#contextFlag:empty {
  display: none;
}

#antibiotics {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0.75rem;
}

#antibiotics details {
  display: block;
  background: rgba(255, 255, 255, 0.98);
  border-radius: 20px;
  border: 1px solid rgba(17, 84, 101, 0.14);
  box-shadow: 0 18px 35px rgba(17, 32, 52, 0.16);
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border 0.2s ease;
}

#antibiotics details:hover,
#antibiotics details:focus-within {
  transform: translateY(-2px);
  box-shadow: 0 24px 45px rgba(17, 32, 52, 0.22);
  border-color: rgba(15, 157, 138, 0.25);
}

#antibiotics summary {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 1.05rem 1.3rem;
  cursor: pointer;
  gap: 1.25rem;
}

#antibiotics .summary-left {
  display: inline-flex;
  flex: 1 1 auto;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
  min-width: 0;
}

#antibiotics .summary-left .drug {
  font-weight: 700;
  letter-spacing: -0.01em;
}

#antibiotics .route-chips {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}

#antibiotics .route-chip {
  display: inline-flex;
  align-items: center;
  padding: 0.2rem 0.6rem;
  border-radius: 999px;
  background: rgba(91, 33, 182, 0.12);
  color: var(--violet);
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  box-shadow: var(--chip-shadow);
}

#antibiotics .route-chip[data-route="iv"] {
  background: rgba(15, 157, 138, 0.16);
  color: var(--accent-strong);
}

#antibiotics .route-chip[data-route="po"] {
  background: rgba(249, 115, 22, 0.18);
  color: #b45309;
}

#antibiotics .route-chip[data-route="im"] {
  background: rgba(59, 130, 246, 0.18);
  color: #1d4ed8;
}

#antibiotics .route-chip[data-route^="inhaled"] {
  background: rgba(14, 165, 233, 0.18);
  color: #0369a1;
}

#antibiotics .route-chip[data-route="topical"] {
  background: rgba(236, 72, 153, 0.16);
  color: #be123c;
}

#antibiotics .route-chip[data-route="ophthalmic"],
#antibiotics .route-chip[data-route="otic"] {
  background: rgba(56, 189, 248, 0.18);
  color: #0c4a6e;
}

#antibiotics summary::-webkit-details-marker {
  display: none;
}

#antibiotics .summary-right {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  margin-left: auto;
}

#antibiotics .meta {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}

#antibiotics .badge-group {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
}

#antibiotics details.has-info .drug {
  display: flex;
  align-items: center;
  font-weight: 600;
  gap: 0.45rem;
}

#antibiotics details.has-info .drug::after {
  content: '\25B8';
  font-size: 1rem;
  color: var(--muted);
  transition: transform 0.2s ease, color 0.2s ease;
}

#antibiotics details.has-info[open] .drug::after {
  transform: rotate(90deg);
  color: var(--accent-strong);
}

#antibiotics .pct {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 700;
  color: var(--ink);
}

#antibiotics .chip {
  width: 1.1rem;
  height: 1.1rem;
  border-radius: 999px;
  display: inline-block;
  box-shadow: var(--chip-shadow);
}

.band-green {
  background: var(--green);
}

.band-yellow {
  background: var(--yellow);
}

.band-red {
  background: var(--red);
}

.badge {
  background: rgba(15, 157, 138, 0.12);
  color: var(--accent-strong);
  border-radius: 999px;
  padding: 0.2rem 0.6rem;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.01em;
}

#antibiotics .drawer {
  padding: 1.2rem 1.4rem 1.4rem;
  border-top: 1px solid rgba(15, 34, 52, 0.08);
  background: linear-gradient(155deg, rgba(255, 255, 255, 0.95), rgba(224, 247, 250, 0.9));
}

#antibiotics .agent-card {
  display: grid;
  gap: 1.25rem;
}

#antibiotics .coverage-card {
  padding: 1rem 1.2rem 1.2rem;
  border-radius: 22px;
  background: linear-gradient(135deg, rgba(91, 33, 182, 0.12), rgba(14, 165, 233, 0.1));
  border: 1px solid rgba(91, 33, 182, 0.18);
  box-shadow: 0 20px 40px rgba(91, 33, 182, 0.12);
}

#antibiotics .coverage-grid {
  margin-top: 0.75rem;
  display: grid;
  gap: 0.75rem;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
}

#antibiotics .coverage-item {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  border-radius: 18px;
  padding: 0.7rem 0.9rem;
  box-shadow: 0 14px 28px rgba(17, 32, 52, 0.12);
  background: rgba(255, 255, 255, 0.85);
  color: var(--ink);
}

#antibiotics .coverage-item.score-1 {
  background: rgba(240, 82, 82, 0.16);
  color: #b91c1c;
}

#antibiotics .coverage-item.score-2 {
  background: rgba(243, 170, 31, 0.18);
  color: #92400e;
}

#antibiotics .coverage-item.score-3 {
  background: rgba(15, 190, 123, 0.18);
  color: #047857;
}

#antibiotics .coverage-item.score-4 {
  background: rgba(15, 157, 138, 0.2);
  color: var(--accent-strong);
}

#antibiotics .coverage-item.score-na {
  background: rgba(17, 32, 52, 0.08);
  color: var(--muted);
}

#antibiotics .coverage-face {
  font-size: 1.65rem;
  line-height: 1;
}

#antibiotics .coverage-copy {
  display: grid;
  gap: 0.15rem;
}

#antibiotics .coverage-domain {
  font-weight: 700;
}

#antibiotics .coverage-level {
  font-size: 0.88rem;
  color: rgba(17, 32, 52, 0.68);
}

#antibiotics .info-grid {
  display: grid;
  gap: 1rem;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
}

#antibiotics .info-section {
  background: rgba(255, 255, 255, 0.9);
  border-radius: 20px;
  border: 1px solid rgba(17, 84, 101, 0.14);
  padding: 0.95rem 1.1rem 1.1rem;
  box-shadow: 0 18px 36px rgba(17, 32, 52, 0.14);
}

#antibiotics .drawer-heading {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--accent-strong);
  letter-spacing: 0.01em;
}

#antibiotics .info-section ul {
  margin: 0.6rem 0 0;
  padding-left: 1.15rem;
}

#antibiotics .info-section li {
  margin: 0.35rem 0;
  line-height: 1.5;
}

#antibiotics .info-section li::marker {
  color: rgba(15, 109, 120, 0.85);
}

#filter80 {
  margin: 1.25rem 0 1.1rem;
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  background: rgba(15, 157, 138, 0.12);
  color: var(--accent-strong);
  font-weight: 600;
  padding: 0.5rem 0.9rem;
  border-radius: 999px;
  border: 1px solid rgba(15, 157, 138, 0.28);
}

#filter80 input {
  width: 1rem;
  height: 1rem;
  accent-color: var(--accent);
}

#noData {
  margin-top: 1.5rem;
  font-weight: 600;
  color: var(--muted);
}

footer {
  margin-top: 0;
  padding: 2.25rem 1.5rem 3rem;
  text-align: center;
  color: var(--ink);
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.88), rgba(255, 243, 233, 0.95));
  border-top: 1px solid rgba(15, 157, 138, 0.18);
  box-shadow: 0 -12px 30px rgba(17, 32, 52, 0.08);
  display: grid;
  gap: 1.1rem;
  justify-items: center;
}

footer .hint {
  margin: 0;
  font-size: 1.05rem;
  color: var(--muted);
}

footer .credit {
  font-size: 0.9rem;
  color: rgba(17, 32, 52, 0.6);
  margin: 0;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 820px) {
  header {
    flex-direction: column;
    align-items: flex-start;
    padding: 1.2rem 1.4rem 1.5rem;
    gap: 0.75rem;
  }

  main {
    margin: 2.5rem auto 0;
    padding-bottom: 2.5rem;
  }

  .view {
    padding: 1.45rem;
  }
}

@media (max-width: 580px) {
  header {
    border-bottom-left-radius: 24px;
    border-bottom-right-radius: 24px;
  }

  main {
    padding: 0 1rem 2.5rem;
    gap: 1.25rem;
  }

  #context button,
  #organisms button {
    padding: 0.85rem 1rem;
  }

  #antibiotics summary {
    padding: 0.9rem 1rem;
    flex-wrap: wrap;
  }

  #antibiotics .summary-left,
  #antibiotics .summary-right {
    width: 100%;
  }

  #antibiotics .summary-right {
    justify-content: space-between;
    margin-left: 0;
  }

  #antibiotics .pct {
    margin-left: auto;
  }

  #antibiotics .coverage-grid,
  #antibiotics .info-grid {
    grid-template-columns: 1fr;
  }

  footer {
    padding: 2rem 1.1rem 2.6rem;
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<header>
<div class="title">
<h1><a href="/" id="homeLink">Digital NM Antibiogram</a></h1>
</div>
</header>
<main>
<section id="siteView" class="view">
<label for="site">Select site:</label>
<select id="site" data-focus-default></select>
<button type="button" id="siteContinue" class="continue-button" disabled>
  <span class="label">Continue</span>
  <span class="icon" aria-hidden="true">&rarr;</span>
</button>
</section>
<section id="contextView" class="view" hidden>
<button type="button" class="back-button" data-step="0"><span class="icon" aria-hidden="true">&larr;</span><span class="label">Back to site selection</span></button>
<h2>Choose context</h2>
<div id="context" role="tablist"></div>
</section>
<section id="organismView" class="view" hidden>
<button type="button" class="back-button" data-step="1"><span class="icon" aria-hidden="true">&larr;</span><span class="label">Back to contexts</span></button>
<label for="organismSearch" class="visually-hidden">Search organism</label>
<input id="organismSearch" type="search" placeholder="Search organism" aria-label="Search organism" data-focus-default>
<ul id="organisms"></ul>
</section>
<section id="results" class="view" hidden>
<button type="button" class="back-button" data-step="2"><span class="icon" aria-hidden="true">&larr;</span><span class="label">Back to organisms</span></button>
<h2 id="organismTitle"></h2>
<p id="resultsHint" class="view-hint" hidden>Click on an antimicrobial agent for more details.</p>
<p id="contextFlag"></p>
<label id="filter80"><input type="checkbox"> Show only ≥80% susceptible</label>
<ul id="antibiotics"></ul>
<p id="noData" hidden>No antibiotics match the current filters for this organism/context at this site.</p>
</section>
</main>
<footer>
<p class="hint"></p>
<p class="credit">Made with ❤️ for the Northwestern Medicine community.</p>

<script>
const DATA_INDEX='data/index.json';
const DEFAULT_SITE_ID='nmh';

const SPECIMEN_LABELS={
  'Blood':'Blood',
  'ED':'Emergency Department',
  'Facility-Wide':'Facility-Wide',
  'Immunocompromised Host':'Immunocompromised Host',
  'MICU':'MICU',
  'Other ICU':'Other ICU',
  'Respiratory':'Respiratory',
  'Urine':'Urine'
};

const CONTEXT_PRIORITY=[
  'Facility-Wide',
  'Urine',
  'Blood',
  'Emergency Department',
  'Respiratory',
  'MICU',
  'Other ICU',
  'Immunocompromised Host'
];

const AGENT_DETAILS_FILE='agent_details.md';
const CONTRA_FILE='contraindications.md';

const SUSCEPTIBILITY_BANDS=[
  {id:'green',label:'≥80%',min:80},
  {id:'yellow',label:'70–79%',min:70,max:79},
  {id:'red',label:'≤69%',max:69}
];

const COVERAGE_DOMAINS=[
  {key:'gramPositive',label:'Gram-positive'},
  {key:'gramNegative',label:'Gram-negative'},
  {key:'anaerobes',label:'Anaerobes'}
];

const COVERAGE_LEVELS={
  1:{icon:'😟',text:'Poor coverage'},
  2:{icon:'😐',text:'Limited coverage'},
  3:{icon:'🙂',text:'Good coverage'},
  4:{icon:'😄',text:'Excellent coverage'},
  na:{icon:'🤔',text:'Not rated'}
};

const LEGEND={
  hint:'<strong>For severe syndromes aim for ≥90% when feasible; ≥80% may be acceptable for lower-risk infections.</strong> Use patient-level cultures and ID consult for definitive therapy. Sensitivity data adapted from the <a href="https://adsp.nm.org/" target="_blank" rel="noopener noreferrer">NM Antimicrobial and Diagnostic Stewardship Program</a>.',
  badges:{}
};

let DATA=null;
let DRUG_DETAILS=new Map();
let CONTRAINDICATIONS=new Map();
let current={site:null,ctx:null,org:null};
const qs=s=>document.querySelector(s);
const siteSel=qs('#site'),ctxDiv=qs('#context'),orgSearch=qs('#organismSearch'),orgList=qs('#organisms');
const results=qs('#results'),title=qs('#organismTitle'),antList=qs('#antibiotics'),filter80=qs('#filter80 input'),flag=qs('#contextFlag'),noData=qs('#noData'),hint=qs('.hint'),homeLink=qs('#homeLink'),siteContinue=qs('#siteContinue'),resultsHint=qs('#resultsHint');
const backButtons=Array.from(document.querySelectorAll('.back-button'));
const headerEl=qs('header');
const prefersReducedMotion=typeof window!=='undefined'&&typeof window.matchMedia==='function'?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
const FOCUSABLE_SELECTOR='button:not([disabled]), [href], input:not([type="hidden"]):not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
const VIEW_SCROLL_PADDING=16;
const views=['siteView','contextView','organismView','results'];
let step=0;

loadData();

function loadData(){
  Promise.all([
    loadMarkdownData(),
    loadAgentDetails(),
    loadContraindications()
  ]).then(([entries,details,contra])=>{
    DRUG_DETAILS=details;
    CONTRAINDICATIONS=contra;
    DATA={legend:LEGEND,sites:buildSites(entries)};
    init();
  }).catch(err=>{
    console.error('Failed to load data',err);
    hint.textContent='Unable to load data. Please refresh.';
    siteSel.innerHTML='<option value="">Data unavailable</option>';
  });
}

function loadMarkdownData(){
  return fetch(DATA_INDEX).then(resp=>{
    if(!resp.ok) throw new Error(`Failed to load ${DATA_INDEX}`);
    return resp.json();
  }).then(list=>{
    if(!Array.isArray(list)) throw new Error('Invalid data index');
    return Promise.all(list.map(entry=>{
      const path=typeof entry==='string'?entry:entry.path;
      if(!path) throw new Error('Invalid data entry');
      return fetch(path).then(resp=>{
        if(!resp.ok) throw new Error(`Failed to load ${path}`);
        return resp.text();
      }).then(text=>parseMarkdown(text,path));
    }));
  });
}

function loadAgentDetails(){
  return fetch(AGENT_DETAILS_FILE).then(resp=>{
    if(!resp.ok) throw new Error(`Failed to load ${AGENT_DETAILS_FILE}`);
    return resp.text();
  }).then(parseAgentDetails).catch(err=>{
    console.warn('Agent details unavailable',err);
    return new Map();
  });
}

function loadContraindications(){
  return fetch(CONTRA_FILE).then(resp=>{
    if(!resp.ok) throw new Error(`Failed to load ${CONTRA_FILE}`);
    return resp.text();
  }).then(parseContraindications).catch(err=>{
    console.warn('Contraindications unavailable',err);
    return new Map();
  });
}

function parseAgentDetails(text){
  const map=new Map();
  if(!text)return map;
  const sanitized=text.replace(/\r?\n\s+\|/g,' |');
  const lines=sanitized.split(/\r?\n/).map(line=>line.trim()).filter(Boolean);
  const tableLines=lines.filter(line=>line.startsWith('|'));
  if(tableLines.length<3)return map;
  const headers=splitMarkdownRow(tableLines[0]);
  const agentIdx=headers.findIndex(h=>/agent/i.test(h));
  if(agentIdx===-1)return map;
  const columnIndex={
    route:headers.findIndex(h=>/route/i.test(h)),
    gramPositive:headers.findIndex(h=>/gram-?positive/i.test(h)),
    gramNegative:headers.findIndex(h=>/gram-?negative/i.test(h)),
    anaerobes:headers.findIndex(h=>/anaerob/i.test(h)),
    contraindications:headers.findIndex(h=>/contraindications/i.test(h)),
    interactions:headers.findIndex(h=>/interactions/i.test(h))
  };
  const getCell=(cells,index)=>index>=0?cells[index]||'':'';
  tableLines.slice(2).forEach(line=>{
    if(/^\|\s*:?[-]{2,}/.test(line))return;
    const cells=splitMarkdownRow(line);
    if(!cells.length)return;
    const rawName=(cells[agentIdx]||'').replace(/\*/g,'').trim();
    if(!rawName)return;
    const key=canonicalDrugName(rawName);
    if(!key)return;
    const routes=parseMarkdownList(getCell(cells,columnIndex.route));
    const coverage={
      gramPositive:parseCoverageValue(getCell(cells,columnIndex.gramPositive)),
      gramNegative:parseCoverageValue(getCell(cells,columnIndex.gramNegative)),
      anaerobes:parseCoverageValue(getCell(cells,columnIndex.anaerobes))
    };
    const contraindications=parseMarkdownList(getCell(cells,columnIndex.contraindications));
    const interactions=parseMarkdownList(getCell(cells,columnIndex.interactions));
    map.set(key,{
      name:rawName,
      routes,
      coverage,
      contraindications,
      interactions
    });
  });
  return map;
}

function parseContraindications(text){
  const map=new Map();
  text.split('\n').forEach(line=>{
    const trimmed=line.trim();
    if(!trimmed.startsWith('|'))return;
    if(/^\|\s*-{3,}/.test(trimmed))return;
    const cells=trimmed.split('|').slice(1,-1).map(cell=>cell.trim());
    if(cells.length<3)return;
    const [drugCell,contraCell,interactionCell]=cells;
    const cleanDrug=drugCell.replace(/\*/g,'').trim();
    if(!cleanDrug||cleanDrug.toLowerCase()==='antibiotic')return;
    const key=canonicalDrugName(cleanDrug);
    if(!key)return;
    map.set(key,{
      contraindications:parseMarkdownList(contraCell),
      interactions:parseMarkdownList(interactionCell)
    });
  });
  return map;
}

function parseMarkdownList(cell){
  if(!cell)return [];
  const normalized=String(cell).replace(/•/g,' - ');
  return normalized.split(/-\s+/).map(item=>item.trim()).filter(Boolean);
}

function combineInfoLists(...lists){
  const seen=new Set();
  const combined=[];
  lists.forEach(list=>{
    if(Array.isArray(list)){
      list.forEach(item=>{
        const normalized=typeof item==='string'?item.trim():String(item??'').trim();
        if(normalized&&!seen.has(normalized)){
          seen.add(normalized);
          combined.push(normalized);
        }
      });
    }
  });
  return combined;
}

function canonicalDrugName(name){
  return (name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
}

function buildSiteDisplay(meta){
  const region=(meta.region||'').trim();
  const site=(meta.site||'').trim();
  if(region&&site&&region!==site)return `${region} (${site})`;
  return region||site||meta.site_id||'Site';
}

function parseMarkdown(text,path){
  const {meta,body}=extractFrontMatter(text,path);
  const table=parseMarkdownTable(body,path);
  return {meta,table};
}

function extractFrontMatter(text,path){
  const lines=text.split(/\r?\n/);
  if(lines[0]?.trim()!=='---')return{meta:{},body:text};
  let end=1;
  while(end<lines.length&&lines[end].trim()!=='---'){end++;}
  if(end>=lines.length){
    console.warn('Front matter not closed in',path);
    return{meta:{},body:text};
  }
  const metaText=lines.slice(1,end).join('\n').trim();
  let meta={};
  if(metaText){
    try{meta=JSON.parse(metaText);}catch(err){console.warn('Invalid front matter for',path,err);}
  }
  const body=lines.slice(end+1).join('\n');
  return {meta,body};
}

function parseMarkdownTable(body,path){
  const rows=body.split(/\r?\n/).map(line=>line.trim()).filter(Boolean);
  const tableLines=rows.filter(line=>line.startsWith('|'));
  if(!tableLines.length){
    console.warn('No table content found in',path);
    return{headers:[],rows:[]};
  }
  const headers=splitMarkdownRow(tableLines[0]);
  let dataStart=1;
  for(let i=1;i<tableLines.length;i++){
    if(/^\|\s*:?[-]{2,}/.test(tableLines[i])){dataStart=i+1;break;}
  }
  const dataRows=tableLines.slice(dataStart).map(line=>{
    const cells=splitMarkdownRow(line);
    const record={};
    headers.forEach((header,idx)=>{record[header]=cells[idx]??'';});
    return record;
  }).filter(record=>Object.values(record).some(value=>String(value).trim()!==''));
  return{headers,rows:dataRows};
}

function splitMarkdownRow(line){
  const trimmed=line.trim();
  const inner=trimmed.replace(/^\|/,'').replace(/\|$/,'');
  return inner.split('|').map(cell=>cell.trim());
}

function prioritizeDefaultSite(sites){
  if(!Array.isArray(sites)||!sites.length||!DEFAULT_SITE_ID)return sites;
  const index=sites.findIndex(site=>site.id===DEFAULT_SITE_ID);
  if(index<=0)return sites;
  const prioritized=sites.slice();
  const [defaultSite]=prioritized.splice(index,1);
  prioritized.unshift(defaultSite);
  return prioritized;
}

function buildSites(entries){
  const siteMap=new Map();
  entries.forEach(entry=>{
    const meta=entry.meta||{};
    const table=entry.table||{};
    const headers=Array.isArray(table.headers)?table.headers:[];
    if(!headers.length)return;
    const siteId=(meta.site_id||slugify(meta.display||meta.site||meta.region||'site')).trim();
    const siteName=(meta.display||buildSiteDisplay(meta)).trim();
    if(!siteMap.has(siteId)){
      siteMap.set(siteId,{id:slugify(siteId),name:siteName,contexts:[]});
    }
    const siteEntry=siteMap.get(siteId);
    const contextLabel=meta.context_label||meta.context||'Context';
    const contextId=slugify(meta.context||contextLabel);
    const notes=Array.isArray(meta.notes)?meta.notes.filter(Boolean):[];
    const flags=Array.isArray(meta.flags)?meta.flags.filter(Boolean):[];
    const isolatesHeader=headers.find(h=>h.toLowerCase()==='isolates')||headers[1];
    const antibioticHeaders=headers.filter(h=>h!==isolatesHeader&&h!==headers[0]);
    const organisms=[];
    (table.rows||[]).forEach(row=>{
      const organismName=row[headers[0]]||row.Organism||'';
      if(!organismName) return;
      const isolates=parseInteger(row[isolatesHeader]);
      const antibiotics=[];
      antibioticHeaders.forEach(header=>{
        const pct=parseNumber(row[header]);
        if(Number.isFinite(pct)){
          const key=canonicalDrugName(header);
          const detailEntry=DRUG_DETAILS.get(key);
          const contraEntry=CONTRAINDICATIONS.get(key);
          const contraindications=combineInfoLists(detailEntry?.contraindications,contraEntry?.contraindications);
          const interactions=combineInfoLists(detailEntry?.interactions,contraEntry?.interactions);
          const routes=combineInfoLists(detailEntry?.routes);
          const coverage=detailEntry?{
            gramPositive:detailEntry.coverage?.gramPositive??null,
            gramNegative:detailEntry.coverage?.gramNegative??null,
            anaerobes:detailEntry.coverage?.anaerobes??null
          }:null;
          antibiotics.push({
            drug:header,
            pctS:pct,
            notes:[],
            cautions:[],
            flags:[],
            contraindications,
            interactions,
            routes,
            coverage
          });
        }
      });
      if(!antibiotics.length)return;
      antibiotics.sort((a,b)=>b.pctS-a.pctS||a.drug.localeCompare(b.drug));
      organisms.push({
        id:slugify(organismName),
        display:organismName,
        isolates:Number.isFinite(isolates)?isolates:null,
        antibiotics
      });
    });
    if(!organisms.length)return;
    organisms.sort((a,b)=>a.display.localeCompare(b.display));
    siteEntry.contexts.push({
      id:contextId,
      name:contextLabel,
      flags,
      notes,
      organisms
    });
  });

  const sites=Array.from(siteMap.values()).map(site=>{
    const contexts=site.contexts.filter(ctx=>ctx.organisms.length).sort((a,b)=>contextRank(a.name)-contextRank(b.name)||a.name.localeCompare(b.name));
    return{...site,contexts};
  }).filter(site=>site.contexts.length).sort((a,b)=>a.name.localeCompare(b.name));
  return prioritizeDefaultSite(sites);
}

function parseInteger(value){
  if(value===null||value===undefined)return NaN;
  const str=String(value).trim();
  if(!str)return NaN;
  const num=Number(str.replace(/,/g,''));
  return Number.isFinite(num)?Math.round(num):NaN;
}

function parseNumber(value){
  if(value===null||value===undefined)return NaN;
  const str=String(value).trim();
  if(!str)return NaN;
  const cleaned=str.replace('%','');
  const num=Number(cleaned);
  return Number.isFinite(num)?Math.round(num):NaN;
}

function parseCoverageValue(value){
  if(value===null||value===undefined)return null;
  const str=String(value).trim();
  if(!str)return null;
  if(/^(na|n\/a)$/i.test(str))return null;
  const num=Number(str);
  if(!Number.isFinite(num))return null;
  const clamped=Math.max(1,Math.min(4,Math.round(num)));
  return clamped;
}

function contextRank(name){
  const idx=CONTEXT_PRIORITY.indexOf(name);
  return idx===-1?CONTEXT_PRIORITY.length:idx;
}

function slugify(str){
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function init(){
  hint.innerHTML=DATA.legend.hint;
  populateSites();
  siteSel.addEventListener('change',()=>{
    const selectedSite=siteSel.value;
    updateSiteContinueState();
    if(selectedSite){
      renderContexts(selectedSite);
      showStep(1);
    }else{
      renderContexts('');
      showStep(0);
    }
  });
  if(siteContinue){
    siteContinue.addEventListener('click',()=>{
      const selectedSite=siteSel.value;
      if(!selectedSite)return;
      renderContexts(selectedSite);
      showStep(1);
    });
  }
  orgSearch.addEventListener('input',filterOrganisms);
  filter80.addEventListener('change',renderAntibiotics);
  homeLink.addEventListener('click',e=>{e.preventDefault();showStep(0);});
  backButtons.forEach(button=>button.addEventListener('click',handleBackNavigation));
  updateSiteContinueState();
  showStep(0);
}

function updateSiteContinueState(){
  if(!siteContinue)return;
  const hasSelection=Boolean(siteSel&&siteSel.value);
  siteContinue.disabled=!hasSelection;
}

function handleBackNavigation(event){
  const targetStep=Number(event.currentTarget.dataset.step);
  if(Number.isFinite(targetStep)){
    showStep(Math.max(0,Math.min(views.length-1,targetStep)));
  }
}

function populateSites(){
  const hasDefault=DATA.sites.some(site=>site.id===DEFAULT_SITE_ID);
  const placeholderAttrs=hasDefault?' disabled hidden':' disabled selected';
  const options=DATA.sites.map(site=>{
    const selected=hasDefault&&site.id===DEFAULT_SITE_ID?' selected':'';
    return `<option value="${site.id}"${selected}>${escapeHtml(site.name)}</option>`;
  }).join('');
  siteSel.innerHTML=`<option value=""${placeholderAttrs}>Select site</option>\n${options}`;
  if(hasDefault){
    siteSel.value=DEFAULT_SITE_ID;
  }
  renderContexts('');
  updateSiteContinueState();
  return hasDefault;
}

function renderContexts(siteId){
  current.site=DATA.sites.find(s=>s.id===siteId)||null;
  current.ctx=null;
  current.org=null;
  ctxDiv.innerHTML='';
  orgList.innerHTML='';
  orgSearch.value='';
  filter80.checked=false;
  title.textContent='';
  flag.textContent='';
  flag.hidden=true;
  if(resultsHint)resultsHint.hidden=true;
  antList.innerHTML='';
  noData.hidden=true;
  if(!current.site)return;
  ctxDiv.innerHTML=current.site.contexts.map((c,index)=>{
    const focusAttr=index===0?' data-focus-default':'';
    return `<button data-id="${c.id}"${focusAttr}>${escapeHtml(c.name)}</button>`;
  }).join('');
  ctxDiv.querySelectorAll('button').forEach((b,index)=>{
    if(index===0){
      b.setAttribute('data-focus-default','');
    }else{
      b.removeAttribute('data-focus-default');
    }
    b.addEventListener('click',()=>activateContext(b.dataset.id));
  });
}

function activateContext(ctxId){
  const previousCtxId=current.ctx?current.ctx.id:null;
  const contexts=Array.isArray(current.site?.contexts)?current.site.contexts:[];
  current.ctx=contexts.find(c=>c.id===ctxId)||null;
  ctxDiv.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===ctxId));
  if(!current.ctx){
    current.org=null;
    flag.textContent='';
    flag.hidden=true;
    renderOrganisms();
    return;
  }
  if(current.ctx.id!==previousCtxId){
    current.org=null;
  }
  flag.textContent='';
  flag.hidden=true;
  renderOrganisms();
  showStep(2);
}

function renderOrganisms(){
  if(!current.ctx){
    orgList.innerHTML='';
    current.org=null;
    return;
  }
  const orgs=current.ctx.organisms.slice().sort((a,b)=>a.display.localeCompare(b.display));
  orgList.innerHTML=orgs.map(o=>`<li><button data-id="${o.id}">${escapeHtml(o.display)}</button></li>`).join('');
  const buttons=orgList.querySelectorAll('button');
  buttons.forEach(b=>b.addEventListener('click',()=>selectOrganism(b.dataset.id)));
  orgSearch.value='';
  filterOrganisms();
  highlightCurrentOrganism();
}

function filterOrganisms(){
  const q=orgSearch.value.toLowerCase();
  orgList.querySelectorAll('li').forEach(li=>{
    li.style.display=li.textContent.toLowerCase().includes(q)?'':'none';
  });
}

function highlightCurrentOrganism(){
  const selectedId=current.org?current.org.id:null;
  let hasMatch=false;
  orgList.querySelectorAll('button').forEach(button=>{
    const isMatch=Boolean(selectedId)&&button.dataset.id===selectedId;
    button.classList.toggle('active',isMatch);
    if(isMatch){
      hasMatch=true;
    }
  });
  if(selectedId&&!hasMatch){
    current.org=null;
  }
}

function selectOrganism(id){
  const ctxOrganisms=Array.isArray(current.ctx?.organisms)?current.ctx.organisms:[];
  const org=ctxOrganisms.find(o=>o.id===id);
  if(!org){
    noData.hidden=false;
    current.org=null;
    highlightCurrentOrganism();
    return;
  }
  current.org=org;
  highlightCurrentOrganism();
  title.textContent=org.display;
  const notice=getContextNotice(current.ctx);
  if(notice){
    flag.textContent=notice;
    flag.hidden=false;
  }else{
    flag.textContent='';
    flag.hidden=true;
  }
  if(resultsHint)resultsHint.hidden=false;
  noData.hidden=true;
  renderAntibiotics();
  showStep(3);
}

function renderInfoSection(title,items,className=''){
  const list=Array.isArray(items)?items.map(item=>typeof item==='string'?item.trim():item).filter(Boolean):[];
  if(!list.length)return '';
  const entries=list.map(item=>`<li>${formatListItem(item)}</li>`).join('');
  const cls=className?` ${className}`:'';
  return `<div class="info-section${cls}"><h3 class="drawer-heading">${title}</h3><ul>${entries}</ul></div>`;
}

function renderCoverageCard(coverage){
  if(!coverage||typeof coverage!=='object')return '';
  const items=COVERAGE_DOMAINS.map(domain=>renderCoverageItem(domain.label,coverage[domain.key])).filter(Boolean);
  if(!items.length)return '';
  return `<div class="coverage-card"><h3 class="drawer-heading">Coverage snapshot</h3><div class="coverage-grid" role="list">${items.join('')}</div></div>`;
}

function renderCoverageItem(label,value){
  const numericScore=Number.isFinite(value)?Math.max(1,Math.min(4,Math.round(value))):null;
  const ratingKey=numericScore??'na';
  const rating=COVERAGE_LEVELS[ratingKey]||COVERAGE_LEVELS.na;
  const descriptor=rating.text+(numericScore?` · ${numericScore}/4`:'');
  return `<div class="coverage-item score-${ratingKey}" role="listitem"><span class="coverage-face" aria-hidden="true">${rating.icon}</span><div class="coverage-copy"><span class="coverage-domain">${escapeHtml(label)}</span><span class="coverage-level">${escapeHtml(descriptor)}</span></div></div>`;
}

function renderRouteChips(routes){
  const list=combineInfoLists(routes);
  if(!list.length)return '';
  const chips=list.map(route=>createRouteChip(route)).join('');
  return `<span class="route-chips" role="list" aria-label="Routes of administration"><span class="visually-hidden">Routes:</span>${chips}</span>`;
}

function createRouteChip(route){
  const key=getRouteKey(route);
  const dataAttr=key?` data-route="${key}"`:'';
  return `<span class="route-chip"${dataAttr} role="listitem">${escapeHtml(route)}</span>`;
}

function getRouteKey(route){
  const cleaned=String(route||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!cleaned)return '';
  const aliases=[
    'iv',
    'po',
    'im',
    'inhaled',
    'topical',
    'ophthalmic',
    'otic',
    'subcutaneous',
    'intrathecal',
    'intraperitoneal'
  ];
  const match=aliases.find(key=>cleaned.startsWith(key));
  if(match==='subcutaneous')return 'subcutaneous';
  if(match==='intraperitoneal')return 'intraperitoneal';
  if(match==='intrathecal')return 'intrathecal';
  if(match)return match;
  if(cleaned.startsWith('sq')||cleaned.startsWith('sc'))return 'subcutaneous';
  if(cleaned.startsWith('intramuscular'))return 'im';
  return cleaned;
}

function escapeHtml(str){
  const map={
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  };
  return String(str??'').replace(/[&<>"']/g,ch=>map[ch]);
}

function formatListItem(content){
  const normalized=typeof content==='string'?content.trim():String(content??'');
  if(!normalized)return '';
  const escaped=escapeHtml(normalized);
  return escaped.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

function getContextNotice(ctx){
  if(!ctx)return '';
  const notices=[];
  if(Array.isArray(ctx.flags)){
    ctx.flags.forEach(flagKey=>{
      const text=DATA.legend.badges?DATA.legend.badges[flagKey]:null;
      if(text)notices.push(text);
      else if(typeof flagKey==='string'&&flagKey.trim())notices.push(flagKey.trim());
    });
  }
  if(Array.isArray(ctx.notes)){
    ctx.notes.forEach(note=>{
      if(typeof note==='string'&&note.trim())notices.push(note.trim());
    });
  }
  return notices.join(' • ');
}

function getSusceptibilityBand(pct){
  if(!Number.isFinite(pct))return SUSCEPTIBILITY_BANDS[0].id;
  for(const band of SUSCEPTIBILITY_BANDS){
    const hasMin=typeof band.min==='number';
    const hasMax=typeof band.max==='number';
    if(hasMin&&hasMax&&pct>=band.min&&pct<=band.max)return band.id;
    if(hasMin&&!hasMax&&pct>=band.min)return band.id;
    if(!hasMin&&hasMax&&pct<=band.max)return band.id;
  }
  return SUSCEPTIBILITY_BANDS[0].id;
}

function getBandLabel(bandId){
  const entry=SUSCEPTIBILITY_BANDS.find(band=>band.id===bandId);
  return entry?entry.label:'';
}

function renderAntibiotics(){
  antList.innerHTML='';
  if(!current.org){
    noData.hidden=true;
    return;
  }
  let count=0;
  const greenBand=SUSCEPTIBILITY_BANDS.find(band=>band.id==='green');
  const minForFilter=greenBand&&typeof greenBand.min==='number'?greenBand.min:80;
  const abs=current.org.antibiotics.slice().sort((a,b)=>b.pctS-a.pctS||a.drug.localeCompare(b.drug));
  abs.forEach(ab=>{
    if(filter80.checked&&ab.pctS<minForFilter)return;
    const band=getSusceptibilityBand(ab.pctS);
    const bandLabel=getBandLabel(band);
    const badges=(ab.flags||[]).map(f=>`<span class="badge">${DATA.legend.badges[f]||f}</span>`).join('');
    const coverageHtml=renderCoverageCard(ab.coverage);
    const infoSections=[];
    const contraindicationsSection=renderInfoSection('Major contraindications',ab.contraindications);
    if(contraindicationsSection)infoSections.push(contraindicationsSection);
    const interactionsSection=renderInfoSection('Major drug interactions',ab.interactions);
    if(interactionsSection)infoSections.push(interactionsSection);
    const notesSection=renderInfoSection('Notes',ab.notes);
    if(notesSection)infoSections.push(notesSection);
    const cautionsSection=renderInfoSection('Cautions',ab.cautions);
    if(cautionsSection)infoSections.push(cautionsSection);
    const infoGrid=infoSections.length?`<div class="info-grid">${infoSections.join('')}</div>`:'';
    const cardSegments=[];
    if(infoGrid)cardSegments.push(infoGrid);
    if(coverageHtml)cardSegments.push(coverageHtml);
    const drawerContent=cardSegments.length?`<div class="agent-card">${cardSegments.join('')}</div>`:'';
    const hasInfo=Boolean(drawerContent);
    const badgeGroup=badges?`<span class="badge-group">${badges}</span>`:'';
    const metaHtml=badgeGroup?`<span class="meta">${badgeGroup}</span>`:'';
    const accessibleBand=bandLabel?`<span class="visually-hidden">${bandLabel} susceptible – </span>`:'';
    const pctHtml=`<span class="pct"><span class="chip band-${band}" aria-hidden="true"></span>${accessibleBand}${ab.pctS}%</span>`;
    const routeChips=renderRouteChips(ab.routes);
    const summaryLeft=`<span class="summary-left"><span class="drug">${escapeHtml(ab.drug)}</span>${routeChips}</span>`;
    const summaryRight=`<span class="summary-right">${metaHtml}${pctHtml}</span>`;
    const drawer=hasInfo?`<div class="drawer">${drawerContent}</div>`:'';
    const cls=hasInfo?' class="has-info"':'';
    antList.insertAdjacentHTML('beforeend',`<li><details${cls}><summary>${summaryLeft}${summaryRight}</summary>${drawer}</details></li>`);
    count++;
  });
  noData.hidden=count>0;
}

function getHeaderHeight(){
  if(!headerEl)return 0;
  const rect=headerEl.getBoundingClientRect();
  return rect.height||0;
}

function shouldScrollToView(view){
  if(!view)return false;
  const rect=view.getBoundingClientRect();
  if(rect.height===0)return false;
  const headerHeight=getHeaderHeight();
  const viewportTop=headerHeight+VIEW_SCROLL_PADDING;
  const viewportBottom=window.innerHeight-VIEW_SCROLL_PADDING;
  const tolerance=4;
  return rect.top<viewportTop-tolerance||rect.top>viewportBottom+tolerance;
}

function scrollViewIntoPosition(view){
  if(!view)return;
  const rect=view.getBoundingClientRect();
  const headerHeight=getHeaderHeight();
  const targetY=window.scrollY+rect.top-headerHeight-VIEW_SCROLL_PADDING;
  const behavior=prefersReducedMotion&&prefersReducedMotion.matches?'auto':'smooth';
  window.scrollTo({top:Math.max(0,targetY),behavior});
}

function focusView(view){
  if(!view)return;
  let target=view.querySelector('[data-focus-default]');
  if(!target){
    target=view.querySelector('[autofocus]');
  }
  if(!target){
    target=view.querySelector(FOCUSABLE_SELECTOR);
  }
  if(!target){
    if(!view.hasAttribute('tabindex')){
      view.setAttribute('tabindex','-1');
      view.addEventListener('blur',()=>view.removeAttribute('tabindex'),{once:true});
    }
    target=view;
  }
  safeFocus(target);
}

function safeFocus(element){
  if(!element||typeof element.focus!=='function')return;
  try{
    element.focus({preventScroll:true});
  }catch(err){
    try{element.focus();}catch(e){}
  }
}

function showStep(n){
  const targetStep=Math.max(0,Math.min(views.length-1,n));
  step=targetStep;
  views.forEach((v,i)=>{
    const el=qs('#'+v);
    if(!el)return;
    const isActive=i===step;
    el.hidden=!isActive;
    if(isActive){
      el.removeAttribute('aria-hidden');
      el.removeAttribute('inert');
    }else{
      el.setAttribute('aria-hidden','true');
      el.setAttribute('inert','');
    }
  });
  const activeView=qs('#'+views[step]);
  if(!activeView)return;
  const runAfterLayout=()=>{
    if(shouldScrollToView(activeView)){
      scrollViewIntoPosition(activeView);
    }
    focusView(activeView);
  };
  if(typeof requestAnimationFrame==='function'){
    requestAnimationFrame(runAfterLayout);
  }else{
    runAfterLayout();
  }
}
