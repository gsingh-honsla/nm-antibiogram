<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital NM Antibiogram</title>
<style>
/* Theme colors */
:root{--green:#2e7d32;--yellow:#f9a825;--red:#c62828;--accent:#00796b;--accent-bg:rgba(0,121,107,.85);--accent-border:rgba(0,121,107,.5);--accent-light:rgba(0,121,107,.1)}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;margin:0;font-size:17px;background:#fff;color:#1c1c1e}
header,footer{padding:.75rem 1.25rem;background:var(--accent-bg);color:#fff;backdrop-filter:blur(10px);position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:.5rem}
#backBtn{background:none;border:1px solid #fff;color:#fff;font:inherit;cursor:pointer;padding:.25rem .5rem;border-radius:.75rem}
#backBtn:hover,#backBtn:focus{background:rgba(255,255,255,0.2)}
.view{padding:1rem}
#context{display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem}
#context button{padding:.75rem 1rem;border:1px solid var(--accent-border);border-radius:1rem;background:#fff;font:inherit;color:var(--accent);cursor:pointer;transition:background .2s,color .2s}
#context button:hover{background:var(--accent-light)}
#context button.active{background:var(--accent-bg);color:#fff}
#organismSearch{width:100%;padding:.6rem;margin:1rem 0;border:1px solid var(--accent-border);border-radius:1rem}
#organisms{list-style:none;margin:0;padding:0;max-height:70vh;overflow:auto}
#organisms li+li{margin-top:.25rem}
#organisms button{display:block;width:100%;padding:.75rem;text-align:left;background:#fff;border:1px solid var(--accent-border);border-radius:1rem;font:inherit;color:var(--accent);cursor:pointer}
#organisms button:hover{background:var(--accent-light)}
#results{padding:1rem}
#results[hidden]{display:none}
#antibiotics{list-style:none;margin:0;padding:0}
#antibiotics li+li{margin-top:.5rem}
#antibiotics details{display:block;background:#fff;border-radius:1rem;box-shadow:0 1px 3px rgba(0,0,0,.1)}
#antibiotics summary{display:flex;justify-content:space-between;align-items:center;padding:.75rem;cursor:pointer}
#antibiotics summary::-webkit-details-marker{display:none}
#antibiotics details.has-info .drug{display:flex;align-items:center}
#antibiotics details.has-info .drug::after{content:'▸';margin-left:.3rem;transition:transform .2s}
#antibiotics details.has-info[open] .drug::after{transform:rotate(90deg)}
#antibiotics .drawer{padding:.5rem 1rem;border-top:1px solid #eee}
#antibiotics .drawer ul{margin:.25rem 0;padding-left:1.25rem}
#antibiotics .drawer ul+ul{margin-top:.5rem}
#antibiotics .chip{width:1rem;height:1rem;border-radius:.5rem;margin-right:.3rem;display:inline-block}
.band-green{background:var(--green)}
.band-yellow{background:var(--yellow)}
.band-red{background:var(--red)}
.badge{background:var(--accent-light);color:var(--accent);border-radius:.5rem;padding:.1rem .3rem;margin-left:.3rem;font-size:.75rem}
#filter80{margin:.5rem 0}
footer{font-size:.95rem;text-align:center;flex-direction:column}
footer .bands{display:flex;gap:1rem;justify-content:center;margin-bottom:.5rem}
footer .bands span{display:flex;align-items:center;gap:.3rem}
footer .bands .chip{width:1.2rem;height:1.2rem;border-radius:.6rem}
footer .disclaimer{font-weight:bold}
footer .credit{font-size:.85rem;color:rgba(255,255,255,0.8);margin-top:.5rem}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media(prefers-reduced-motion:reduce){*{animation:none;transition:none}}
</style>
</head>
<body>
<header style="box-shadow:0 1px 2px rgba(0,0,0,0.1)">
<button id="backBtn" hidden>&larr; Back</button>
<h1 style="font-size:1.25rem;margin:0;"><a href="/" id="homeLink" style="color:inherit;text-decoration:none;">Digital NM Antibiogram</a></h1>
</header>
<main>
<section id="siteView" class="view">
<label for="site">Select site:</label>
<select id="site"></select>
</section>
<section id="contextView" class="view" hidden>
<h2>Choose context</h2>
<div id="context" role="tablist"></div>
</section>
<section id="organismView" class="view" hidden>
<label for="organismSearch" class="visually-hidden">Search organism</label>
<input id="organismSearch" type="search" placeholder="Search organism" aria-label="Search organism">
<ul id="organisms"></ul>
</section>
<section id="results" class="view" hidden>
<h2 id="organismTitle"></h2>
<p id="contextFlag" style="color:var(--red);"></p>
<label id="filter80"><input type="checkbox"> Show only ≥80% susceptible</label>
<ul id="antibiotics"></ul>
<p id="noData" hidden>No data for this organism/context at this site.</p>
</section>
</main>
<footer style="box-shadow:0 -1px 2px rgba(0,0,0,0.05)">
<div class="bands"><strong>Color key:</strong>
<span><span class="chip band-green"></span>≥80%</span>
<span><span class="chip band-yellow"></span>70–79%</span>
<span><span class="chip band-red"></span>≤69%</span>
</div>
<p class="hint"></p>
<p class="disclaimer">Use patient-level cultures and ID consult for definitive therapy.</p>
<p class="credit">Made with ❤️ for the NM community.</p>
</footer>
<script>
const DATA_URL='nm_antibiogram_full_final_v6.json';
let DATA=null;
let current={site:null,ctx:null,org:null};
const qs=s=>document.querySelector(s);
const siteSel=qs('#site'),ctxDiv=qs('#context'),orgSearch=qs('#organismSearch'),orgList=qs('#organisms');
const results=qs('#results'),title=qs('#organismTitle'),antList=qs('#antibiotics'),filter80=qs('#filter80 input'),flag=qs('#contextFlag'),noData=qs('#noData'),hint=qs('.hint'),backBtn=qs('#backBtn'),homeLink=qs('#homeLink');
const views=['siteView','contextView','organismView','results'];
let step=0;

fetch(DATA_URL).then(r=>r.json()).then(d=>{DATA=d;init();});

function init(){
  hint.textContent=DATA.legend.hint;
  populateSites();
  siteSel.addEventListener('change',()=>{renderContexts(siteSel.value);showStep(1);});
  orgSearch.addEventListener('input',filterOrganisms);
  filter80.addEventListener('change',renderAntibiotics);
  backBtn.addEventListener('click',()=>{if(step>0)showStep(step-1);});
  homeLink.addEventListener('click',e=>{e.preventDefault();showStep(0);});
  showStep(0);
}

function populateSites(){
  siteSel.innerHTML='<option value="" selected disabled>Select site</option>'+
    DATA.sites.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
}

function renderContexts(siteId){
  current.site=DATA.sites.find(s=>s.id===siteId);
  ctxDiv.innerHTML=current.site.contexts.map(c=>`<button data-id="${c.id}">${c.name}</button>`).join('');
  ctxDiv.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>activateContext(b.dataset.id)));
}

function activateContext(ctxId){
  current.ctx=current.site.contexts.find(c=>c.id===ctxId);
  ctxDiv.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.id===ctxId));
  renderOrganisms();
  showStep(2);
}

function renderOrganisms(){
  const orgs=current.ctx.organisms.slice().sort((a,b)=>a.display.localeCompare(b.display));
  orgList.innerHTML=orgs.map(o=>`<li><button data-id="${o.id}">${o.display}</button></li>`).join('');
  orgList.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>selectOrganism(b.dataset.id)));
  orgSearch.value='';
  filterOrganisms();
}

function filterOrganisms(){
  const q=orgSearch.value.toLowerCase();
  orgList.querySelectorAll('li').forEach(li=>{
    li.style.display=li.textContent.toLowerCase().includes(q)?'':'none';
  });
}

function selectOrganism(id){
  const org=current.ctx.organisms.find(o=>o.id===id);
  if(!org){noData.hidden=false;return;}
  current.org=org;
  title.textContent=org.display;
  flag.textContent=current.ctx.flags&&current.ctx.flags.includes('limited-isolates')?DATA.legend.badges['limited-isolates']:'';
  renderAntibiotics();
  showStep(3);
}

function renderAntibiotics(){
  antList.innerHTML='';
  let abs=current.org.antibiotics.slice().sort((a,b)=>b.pctS-a.pctS||a.drug.localeCompare(b.drug));
  abs.forEach(ab=>{
    if(filter80.checked && ab.pctS<80)return;
    const band=ab.pctS>=80?'green':ab.pctS>=70?'yellow':'red';
    const badges=(ab.flags||[]).map(f=>`<span class="badge">${DATA.legend.badges[f]||f}</span>`).join('');
    const notes=ab.notes.map(n=>`<li>${n}</li>`).join('');
    const caut=ab.cautions.map(c=>`<li>${c}</li>`).join('');
    const notesHtml=notes?`<ul>${notes}</ul>`:'';
    const cautHtml=caut?`<ul>${caut}</ul>`:'';
    const drawer=notesHtml||cautHtml?`<div class="drawer">${notesHtml}${cautHtml}</div>`:'';
    const cls=drawer?' class="has-info"':'';
    antList.insertAdjacentHTML('beforeend',`<li><details${cls}><summary><span class="drug">${ab.drug}</span><span>${badges}</span><span class="pct"><span class="chip band-${band}" aria-hidden="true"></span>${ab.pctS}%</span></summary>${drawer}</details></li>`);
  });
}

function showStep(n){
  step=Math.max(0,Math.min(views.length-1,n));
  views.forEach((v,i)=>{qs('#'+v).hidden=i!==step;});
  backBtn.hidden=step===0;
}
</script>
</body>
</html>
